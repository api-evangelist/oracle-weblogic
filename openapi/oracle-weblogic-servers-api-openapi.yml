openapi: 3.2.0
info:
  title: Oracle Weblogic Servers API
  version: '1.0'
  description: 'Operations tagged Servers across 2 of this provider''s published API definitions: oracle-weblogic-management-openapi.yml, weblogic-servers-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
      description: WebLogic admin server hostname
    port:
      default: '7001'
      description: WebLogic admin server listen port
    version:
      default: latest
      description: REST API version (e.g., latest, 12.2.1.3.0)
- url: https://{host}:{port}/management/weblogic/latest
  description: WebLogic Server Administration Server
  variables:
    host:
      default: localhost
      description: Hostname of the WebLogic Administration Server
    port:
      default: '7001'
      description: Port of the WebLogic Administration Server
security:
- basicAuth: []
tags:
- name: Servers
  description: Manage WebLogic Server instances
paths:
  /edit/servers:
    get:
      operationId: listServers
      summary: Oracle WebLogic Server List all servers
      description: Returns a collection of all server configurations in the domain.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/ExcludeFields'
      - $ref: '#/components/parameters/Links'
      - $ref: '#/components/parameters/ExcludeLinks'
      responses:
        '200':
          description: Collection of servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createServer
      summary: Oracle WebLogic Server Create a new server
      description: Creates a new server configuration in the domain. Requires an active edit session.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      - $ref: '#/components/parameters/SaveChanges'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerCreateRequest'
      responses:
        '201':
          description: Server created successfully
          headers:
            Location:
              description: URL of the newly created server resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/serverCreateForm:
    get:
      operationId: getServerCreateForm
      summary: Oracle WebLogic Server Get server creation form with defaults
      description: Returns a pre-populated template with default values for creating a new server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Server create form with default values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCreateRequest'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/servers/{serverName}:
    get:
      operationId: getServer
      summary: Oracle WebLogic Server Get a specific server configuration
      description: Returns the configuration for the specified server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      - $ref: '#/components/parameters/ExpandedValues'
      responses:
        '200':
          description: Server configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateServer
      summary: Oracle WebLogic Server Update a server configuration
      description: Modifies the configuration of an existing server. Requires an active edit session.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      - $ref: '#/components/parameters/ExpandedValues'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerUpdateRequest'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteServer
      summary: Oracle WebLogic Server Delete a server
      description: Removes a server configuration from the domain. Requires an active edit session.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      responses:
        '204':
          description: Server deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/servers/{serverName}/SSL:
    get:
      operationId: getServerSSL
      summary: Oracle WebLogic Server Get SSL configuration for a server
      description: Returns the SSL/TLS configuration for the specified server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: SSL configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSLConfiguration'
    post:
      operationId: updateServerSSL
      summary: Oracle WebLogic Server Update SSL configuration for a server
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLConfiguration'
      responses:
        '200':
          description: SSL configuration updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/servers/{serverName}/serverStart:
    get:
      operationId: getServerStart
      summary: Oracle WebLogic Server Get server start configuration
      description: Returns startup configuration including arguments and classpath.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      responses:
        '200':
          description: Server start configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStart'
    post:
      operationId: updateServerStart
      summary: Oracle WebLogic Server Update server start configuration
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerStart'
      responses:
        '200':
          description: Server start configuration updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/servers/{serverName}/networkAccessPoints:
    get:
      operationId: listNetworkAccessPoints
      summary: Oracle WebLogic Server List network access points for a server
      description: Returns network channels configured for the specified server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      responses:
        '200':
          description: Collection of network access points
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkAccessPoint'
    post:
      operationId: createNetworkAccessPoint
      summary: Oracle WebLogic Server Create a network access point
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/ServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkAccessPoint'
      responses:
        '201':
          description: Network access point created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /servers:
    get:
      operationId: getServers
      summary: Oracle WebLogic Server APIs List all monitored servers
      description: Returns monitoring information for all servers in the domain including their current state, health, and basic runtime metrics.
      tags:
      - Servers
      responses:
        '200':
          description: List of monitored servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerMonitoring'
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /servers/{serverName}:
    get:
      operationId: getServersByServerName
      summary: Oracle WebLogic Server APIs Get server monitoring information
      description: Returns detailed monitoring information for a specific server including state, health, JVM metrics, and subsystem runtimes.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/serverName'
      responses:
        '200':
          description: Server monitoring information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMonitoring'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
      x-operation-id-source: normalized
      x-operation-id-original: getServer
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /servers/{serverName}/jvm:
    get:
      operationId: getServerJVM
      summary: Oracle WebLogic Server APIs Get server JVM metrics
      description: Returns JVM runtime metrics for the specified server including heap usage, garbage collection statistics, and thread information.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/serverName'
      responses:
        '200':
          description: JVM metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JVMMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /servers/{serverName}/threadPool:
    get:
      operationId: getServerThreadPool
      summary: Oracle WebLogic Server APIs Get server thread pool metrics
      description: Returns thread pool monitoring data for the specified server including thread counts, queue lengths, and throughput.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/serverName'
      responses:
        '200':
          description: Thread pool metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPoolMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /servers/{serverName}/workManagers:
    get:
      operationId: getServerWorkManagers
      summary: Oracle WebLogic Server APIs List work managers on a server
      description: Returns monitoring information for all work managers on the specified server.
      tags:
      - Servers
      parameters:
      - $ref: '#/components/parameters/serverName'
      responses:
        '200':
          description: List of work manager metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkManagerMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
components:
  responses:
    NotFound:
      description: Requested resource does not exist
    BadRequest:
      description: Invalid request - malformed parameters or validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
    NotFound_2:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized_2:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    ExcludeFields:
      name: excludeFields
      in: query
      description: Comma-separated list of property names to exclude from the response
      schema:
        type: string
    Fields:
      name: fields
      in: query
      description: Comma-separated list of property names to include in the response
      schema:
        type: string
      example: name,listenPort
    ExcludeLinks:
      name: excludeLinks
      in: query
      description: Comma-separated list of link relations to exclude
      schema:
        type: string
    ExpandedValues:
      name: expandedValues
      in: query
      description: When true, properties are returned as objects with set and value fields indicating whether the property has been explicitly set.
      schema:
        type: boolean
        default: false
    ServerName:
      name: serverName
      in: path
      required: true
      description: Name of the WebLogic Server instance
      schema:
        type: string
    Links:
      name: links
      in: query
      description: Comma-separated list of link relations to include (e.g., self, parent, canonical). Use 'none' to exclude all links.
      schema:
        type: string
      example: none
    SaveChanges:
      name: saveChanges
      in: query
      description: When false, changes are saved to the edit session but not validated until explicitly saved or activated.
      schema:
        type: boolean
        default: true
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
    serverName:
      name: serverName
      in: path
      required: true
      description: The name of the WebLogic Server instance
      schema:
        type: string
  schemas:
    ServerUpdateRequest:
      type: object
      properties:
        listenPort:
          type: integer
        listenAddress:
          type: string
        administrationPort:
          type: integer
        machine:
          type: array
          items:
            type: string
          description: Machine reference as identity path (set to null to remove)
        cluster:
          type: array
          items:
            type: string
          description: Cluster reference as identity path
        candidateMachines:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    ServerCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name for the new server
        listenPort:
          type: integer
          description: Listen port
          default: 7001
        listenAddress:
          type: string
          description: Listen address
        defaultProtocol:
          type: string
          enum:
          - t3
          - t3s
          - http
          - https
          - iiop
          - iiops
        machine:
          type: array
          items:
            type: string
          description: Machine reference as identity path
        cluster:
          type: array
          items:
            type: string
          description: Cluster reference as identity path
    Server:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
          description: Server name
        listenPort:
          type: integer
          description: Listen port for the server
          default: 7001
        listenAddress:
          type: string
          description: IP address or hostname the server listens on
        listenPortEnabled:
          type: boolean
          description: Whether the non-SSL listen port is enabled
          default: true
        SSLListenPort:
          type: integer
          description: SSL listen port
        administrationPort:
          type: integer
          description: Administration port
        defaultProtocol:
          type: string
          description: Default network protocol
          enum:
          - t3
          - t3s
          - http
          - https
          - iiop
          - iiops
        machine:
          $ref: '#/components/schemas/Identity'
        cluster:
          $ref: '#/components/schemas/Identity'
        candidateMachines:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        idleConnectionTimeout:
          type: integer
          description: Idle connection timeout in seconds
        replicationGroup:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ServerStart:
      type: object
      properties:
        arguments:
          type: string
          description: JVM arguments for server startup
        classPath:
          type: string
          description: Classpath for server startup
        javaHome:
          type: string
          description: Java home directory
        javaVendor:
          type: string
          description: Java vendor
        beaHome:
          type: string
          description: BEA/Oracle home directory
    Identity:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
          description: Bean identity path as an array of path segments
    SSLConfiguration:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Whether SSL is enabled
        listenPort:
          type: integer
          description: SSL listen port
        identityAndTrustLocations:
          type: string
          description: Where identity and trust keystores are stored
        serverPrivateKeyAlias:
          type: string
        serverPrivateKeyPassPhrase:
          type: string
          format: password
        twoWaySSLEnabled:
          type: boolean
        clientCertificateEnforced:
          type: boolean
        hostnameVerificationIgnored:
          type: boolean
    NetworkAccessPoint:
      type: object
      properties:
        name:
          type: string
          description: Network channel name
        protocol:
          type: string
          description: Network protocol
        listenPort:
          type: integer
        listenAddress:
          type: string
        publicPort:
          type: integer
        publicAddress:
          type: string
        enabled:
          type: boolean
    Message:
      type: object
      properties:
        severity:
          type: string
          enum:
          - SUCCESS
          - WARNING
          - FAILURE
        field:
          type: string
          description: Property name associated with this message
        message:
          type: string
          description: Detailed message text
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
          enum:
          - ERRORS
        status:
          type: integer
        wls:errorsDetails:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              detail:
                type: string
              o:errorPath:
                type: string
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title for the link
    ThreadPoolMetrics:
      type: object
      properties:
        executeThreadTotalCount:
          type: integer
          description: Total execute threads
        executeThreadIdleCount:
          type: integer
          description: Idle execute threads
        hoggingThreadCount:
          type: integer
          description: Hogging threads
        stuckThreadCount:
          type: integer
          description: Stuck threads
        pendingUserRequestCount:
          type: integer
          description: Pending user requests
        throughput:
          type: number
          format: double
          description: Thread pool throughput
        completedRequestCount:
          type: integer
          format: int64
          description: Completed requests
        queueLength:
          type: integer
          description: Current queue length
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    WorkManagerMetrics:
      type: object
      properties:
        name:
          type: string
          description: Work manager name
        pendingRequests:
          type: integer
          description: Number of pending requests
        completedRequests:
          type: integer
          format: int64
          description: Number of completed requests
        stuckThreadCount:
          type: integer
          description: Number of stuck threads
    Link_2:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
          format: uri
        title:
          type: string
    ServerMonitoring:
      type: object
      properties:
        name:
          type: string
          description: Server name
        state:
          type: string
          description: Current server state
          enum:
          - RUNNING
          - ADMIN
          - STANDBY
          - SHUTDOWN
          - STARTING
          - SUSPENDING
          - FAILED
          - UNKNOWN
        health:
          type: string
          description: Overall health state
          enum:
          - HEALTH_OK
          - HEALTH_WARN
          - HEALTH_CRITICAL
          - HEALTH_FAILED
          - HEALTH_OVERLOADED
        clusterName:
          type: string
          description: Cluster this server belongs to
        currentMachine:
          type: string
          description: Machine the server is running on
        listenAddress:
          type: string
          description: Listen address
        listenPort:
          type: integer
          description: Listen port
        sslListenPort:
          type: integer
          description: SSL listen port
        activationTime:
          type: integer
          format: int64
          description: Activation time in milliseconds since epoch
        openSocketsCurrentCount:
          type: integer
          description: Current number of open sockets
        weblogicVersion:
          type: string
