openapi: 3.2.0
info:
  title: Oracle Weblogic Edit Session API
  version: 12.2.1.3.0
  contact:
    name: Oracle Support
    url: https://support.oracle.com/
  license:
    name: Oracle Standard License
    url: https://www.oracle.com/downloads/licenses/standard-license.html
  description: 'Operations tagged Edit Session across 2 of this provider''s published API definitions: oracle-weblogic-deployment-openapi.yml, oracle-weblogic-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
    port:
      default: '7001'
    version:
      default: latest
security:
- basicAuth: []
tags:
- name: Edit Session
  description: Manage edit sessions for deployment changes
paths:
  /edit/changeManager/startEdit:
    post:
      operationId: startEdit
      summary: Oracle WebLogic Server Start an edit session for deployment changes
      description: Acquires a configuration lock and starts an edit session. Required before making any deployment configuration changes.
      tags:
      - Edit Session
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                waitTimeInMillis:
                  type: integer
                  description: Maximum time to wait for the edit lock
                exclusive:
                  type: boolean
      responses:
        '200':
          description: Edit session started
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
        port:
          default: '7001'
        version:
          default: latest
  /edit/changeManager/activate:
    post:
      operationId: activateDeploymentChanges
      summary: Oracle WebLogic Server Activate pending deployment changes
      description: Activates all pending deployment changes and distributes them to targeted servers.
      tags:
      - Edit Session
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Changes activated
          content:
            application/json:
              schema:
                type: object
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
        port:
          default: '7001'
        version:
          default: latest
  /edit/changeManager/cancelEdit:
    post:
      operationId: cancelEdit
      summary: Oracle WebLogic Server Cancel the current edit session
      description: Cancels all pending changes in the current edit session and releases the edit lock without activating any changes.
      tags:
      - Edit Session
      parameters:
      - $ref: '#/components/parameters/XRequestedBy_2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Edit session cancelled successfully
          content:
            application/json:
              schema:
                type: object
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/changeManager/undoUnactivatedChanges:
    post:
      operationId: undoUnactivatedChanges
      summary: Oracle WebLogic Server Undo all unactivated changes
      description: Reverts all pending configuration changes that have not yet been activated without releasing the edit lock.
      tags:
      - Edit Session
      parameters:
      - $ref: '#/components/parameters/XRequestedBy_2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Changes undone successfully
          content:
            application/json:
              schema:
                type: object
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
components:
  parameters:
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header
      schema:
        type: string
        example: MyClient
    XRequestedBy_2:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
    BadRequest:
      description: Invalid request - malformed parameters or validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: User does not have the required role
  schemas:
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
          enum:
          - ERRORS
        status:
          type: integer
        wls:errorsDetails:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              detail:
                type: string
              o:errorPath:
                type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. Deployer role required for deployment operations, Operator role for lifecycle operations.
x-refined-from:
- oracle-weblogic-deployment-openapi.yml
- oracle-weblogic-management-openapi.yml
