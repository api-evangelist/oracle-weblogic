openapi: 3.2.0
info:
  title: Oracle Weblogic Domain Configuration API
  version: '1.0'
  description: 'Operations tagged Domain Configuration across 2 of this provider''s published API definitions: oracle-weblogic-management-openapi.yml, weblogic-domain-configuration-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
      description: WebLogic admin server hostname
    port:
      default: '7001'
      description: WebLogic admin server listen port
    version:
      default: latest
      description: REST API version (e.g., latest, 12.2.1.3.0)
- url: https://{host}:{port}/management/weblogic/latest
  description: WebLogic Server Administration Server
  variables:
    host:
      default: localhost
      description: Hostname of the WebLogic Administration Server
    port:
      default: '7001'
      description: Port of the WebLogic Administration Server
security:
- basicAuth: []
tags:
- name: Domain Configuration
  description: View domain-level configuration
paths:
  /edit:
    get:
      operationId: getEditRoot
      summary: Oracle WebLogic Server Get the edit tree root (domain configuration)
      description: Returns the root of the edit configuration tree representing the domain.
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Domain edit tree root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /serverConfig:
    get:
      operationId: getServerConfig
      summary: Oracle WebLogic Server Get the server configuration tree root
      description: Returns the root of the current server configuration (read-only).
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Server configuration root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /domainConfig:
    get:
      operationId: getDomainConfig
      summary: Oracle WebLogic Server Get the last activated domain configuration
      description: Returns the last activated domain configuration (read-only).
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Domain configuration root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/virtualTargets:
    get:
      operationId: listVirtualTargets
      summary: Oracle WebLogic Server List all virtual targets
      tags:
      - Domain Configuration
      responses:
        '200':
          description: Collection of virtual targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualTarget'
    post:
      operationId: createVirtualTarget
      summary: Oracle WebLogic Server Create a virtual target
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualTargetCreateRequest'
      responses:
        '201':
          description: Virtual target created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/partitions:
    get:
      operationId: listPartitions
      summary: Oracle WebLogic Server List all partitions
      tags:
      - Domain Configuration
      responses:
        '200':
          description: Collection of partitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Partition'
    post:
      operationId: createPartition
      summary: Oracle WebLogic Server Create a partition
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionCreateRequest'
      responses:
        '201':
          description: Partition created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/partitions/{partitionName}/resourceGroups:
    get:
      operationId: listResourceGroups
      summary: Oracle WebLogic Server List resource groups for a partition
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/PartitionName'
      responses:
        '200':
          description: Collection of resource groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceGroup'
    post:
      operationId: createResourceGroup
      summary: Oracle WebLogic Server Create a resource group in a partition
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/PartitionName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGroupCreateRequest'
      responses:
        '201':
          description: Resource group created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /domainConfig/servers:
    get:
      operationId: getDomainConfigServers
      summary: Oracle WebLogic Server APIs List all server configurations (read-only)
      description: Returns all server configurations in the domain (read-only view).
      tags:
      - Domain Configuration
      responses:
        '200':
          description: List of server configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /domainConfig/servers/{serverName}:
    get:
      operationId: getDomainConfigServer
      summary: Oracle WebLogic Server APIs Get a server configuration (read-only)
      description: Returns the configuration of a specific server (read-only view).
      tags:
      - Domain Configuration
      parameters:
      - $ref: '#/components/parameters/serverName'
      responses:
        '200':
          description: Server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /domainConfig/clusters:
    get:
      operationId: getDomainConfigClusters
      summary: Oracle WebLogic Server APIs List all cluster configurations (read-only)
      description: Returns all cluster configurations in the domain (read-only view).
      tags:
      - Domain Configuration
      responses:
        '200':
          description: List of cluster configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClusterConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /domainConfig/securityConfiguration:
    get:
      operationId: getDomainSecurityConfig
      summary: Oracle WebLogic Server APIs Get domain security configuration
      description: Returns the security configuration of the domain including realms.
      tags:
      - Domain Configuration
      responses:
        '200':
          description: Security configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
components:
  schemas:
    Partition:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
        realm:
          type: array
          items:
            type: string
          description: Security realm reference
        primaryIdentityDomain:
          type: string
        availableTargets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        defaultTargets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        resourceManagerRef:
          type: array
          items:
            type: string
    VirtualTargetCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        hostNames:
          type: array
          items:
            type: string
        uriPrefix:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    PartitionCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        realm:
          type: array
          items:
            type: string
        primaryIdentityDomain:
          type: string
        availableTargets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        defaultTargets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        resourceManagerRef:
          type: array
          items:
            type: string
    ResourceGroup:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    ResourceGroupCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    Domain:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
          description: Domain name
        configurationVersion:
          type: string
          description: Domain configuration version
        domainVersion:
          type: string
          description: WebLogic Server version
        adminServerName:
          type: string
          description: Name of the administration server
        productionModeEnabled:
          type: boolean
          description: Whether the domain is in production mode
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title for the link
    Identity:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
          description: Bean identity path as an array of path segments
    VirtualTarget:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
        hostNames:
          type: array
          items:
            type: string
        uriPrefix:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    ServerConfiguration:
      type: object
      properties:
        name:
          type: string
          description: Server name
        listenAddress:
          type: string
          description: Listen address for the server
        listenPort:
          type: integer
          description: Listen port for the server
          default: 7001
        SSLListenPort:
          type: integer
          description: SSL listen port
        cluster:
          type: string
          description: Cluster this server belongs to
        machine:
          type: string
          description: Machine this server is assigned to
        listenPortEnabled:
          type: boolean
          description: Whether the plain-text listen port is enabled
        clientCertProxyEnabled:
          type: boolean
          description: Whether client cert proxy is enabled
        startupMode:
          type: string
          description: Server startup mode
          enum:
          - RUNNING
          - STANDBY
          - ADMIN
        autoRestart:
          type: boolean
          description: Whether the server automatically restarts on failure
        restartMax:
          type: integer
          description: Maximum number of restart attempts
        javaCompiler:
          type: string
          description: Java compiler to use for JSP compilation
        stagingMode:
          type: string
          description: Application staging mode
          enum:
          - stage
          - nostage
          - external_stage
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link_2'
      required:
      - name
    SecurityConfiguration:
      type: object
      properties:
        name:
          type: string
        realms:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              authenticationProviders:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
        crossDomainSecurityEnabled:
          type: boolean
        webAppFilesCaseInsensitive:
          type: string
          enum:
          - os
          - 'true'
          - 'false'
    Error:
      type: object
      properties:
        type:
          type: string
          description: Error type URI
        title:
          type: string
          description: Short error title
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed error message
        o:errorPath:
          type: string
          description: Path to the field that caused the error
    ClusterConfiguration:
      type: object
      properties:
        name:
          type: string
          description: Cluster name
        clusterMessagingMode:
          type: string
          description: Messaging mode for the cluster
          enum:
          - unicast
          - multicast
        clusterBroadcastChannel:
          type: string
          description: Multicast channel for cluster communication
        clusterAddress:
          type: string
          description: Comma-separated list of address:port pairs for cluster members
        defaultLoadAlgorithm:
          type: string
          description: Load balancing algorithm
          enum:
          - round-robin
          - weight-based
          - round-robin-affinity
          - weight-based-affinity
          - random
        weblogicPluginEnabled:
          type: boolean
          description: Whether the WebLogic plugin is enabled
        frontendHost:
          type: string
          description: Frontend host for the cluster
        frontendHTTPPort:
          type: integer
          description: Frontend HTTP port
        frontendHTTPSPort:
          type: integer
          description: Frontend HTTPS port
        numberOfServersInClusterAddress:
          type: integer
          description: Number of servers in the cluster address
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link_2'
      required:
      - name
    Link_2:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: Link URI
        title:
          type: string
          description: Link title
    DomainConfiguration:
      type: object
      properties:
        name:
          type: string
          description: Domain name
        adminServerName:
          type: string
          description: Name of the administration server
        domainVersion:
          type: string
          description: WebLogic Server domain version
        productionModeEnabled:
          type: boolean
          description: Whether the domain is in production mode
        configurationVersion:
          type: string
          description: Configuration version string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link_2'
  parameters:
    PartitionName:
      name: partitionName
      in: path
      required: true
      description: Name of the domain partition
      schema:
        type: string
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
    Links:
      name: links
      in: query
      description: Comma-separated list of link relations to include (e.g., self, parent, canonical). Use 'none' to exclude all links.
      schema:
        type: string
      example: none
    Fields:
      name: fields
      in: query
      description: Comma-separated list of property names to include in the response
      schema:
        type: string
      example: name,listenPort
    serverName:
      name: serverName
      in: path
      required: true
      description: The name of the WebLogic Server instance
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using WebLogic Server credentials. Users must have appropriate roles (Admin, Operator, Deployer, or Monitor).
x-refined-from:
- oracle-weblogic-management-openapi.yml
- weblogic-domain-configuration-api-openapi.yml
