openapi: 3.2.0
info:
  title: Oracle Weblogic Data Sources API
  version: '1.0'
  description: 'Operations tagged Data Sources across 2 of this provider''s published API definitions: oracle-weblogic-management-openapi.yml, weblogic-data-sources-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
      description: WebLogic admin server hostname
    port:
      default: '7001'
      description: WebLogic admin server listen port
    version:
      default: latest
      description: REST API version (e.g., latest, 12.2.1.3.0)
- url: https://{host}:{port}/management/weblogic/latest
  description: WebLogic Server Administration Server
  variables:
    host:
      default: localhost
      description: Hostname of the WebLogic Administration Server
    port:
      default: '7001'
      description: Port of the WebLogic Administration Server
security:
- basicAuth: []
tags:
- name: Data Sources
  description: Manage JDBC system resources and data sources
paths:
  /edit/JDBCSystemResources:
    get:
      operationId: listJDBCSystemResources
      summary: Oracle WebLogic Server List all JDBC system resources
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Collection of JDBC system resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JDBCSystemResource'
    post:
      operationId: createJDBCSystemResource
      summary: Oracle WebLogic Server Create a JDBC system resource
      description: Creates a new JDBC data source system resource. Requires an active edit session.
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      - $ref: '#/components/parameters/SaveChanges'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JDBCSystemResourceCreateRequest'
      responses:
        '201':
          description: JDBC system resource created
          headers:
            Location:
              schema:
                type: string
                format: uri
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JDBCSystemResources/{resourceName}:
    get:
      operationId: getJDBCSystemResource
      summary: Oracle WebLogic Server Get a JDBC system resource
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      responses:
        '200':
          description: JDBC system resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JDBCSystemResource'
    delete:
      operationId: deleteJDBCSystemResource
      summary: Oracle WebLogic Server Delete a JDBC system resource
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      responses:
        '204':
          description: JDBC system resource deleted
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JDBCSystemResources/{resourceName}/JDBCResource:
    get:
      operationId: getJDBCResource
      summary: Oracle WebLogic Server Get JDBC resource configuration
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      responses:
        '200':
          description: JDBC resource configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JDBCResource'
    post:
      operationId: updateJDBCResource
      summary: Oracle WebLogic Server Update JDBC resource configuration
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JDBCResource'
      responses:
        '200':
          description: JDBC resource updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JDBCSystemResources/{resourceName}/JDBCResource/JDBCDataSourceParams:
    get:
      operationId: getJDBCDataSourceParams
      summary: Oracle WebLogic Server Get JDBC data source parameters
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      responses:
        '200':
          description: JDBC data source parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JDBCDataSourceParams'
    post:
      operationId: updateJDBCDataSourceParams
      summary: Oracle WebLogic Server Update JDBC data source parameters
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JDBCDataSourceParams'
      responses:
        '200':
          description: JDBC data source parameters updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JDBCSystemResources/{resourceName}/JDBCResource/JDBCDriverParams:
    get:
      operationId: getJDBCDriverParams
      summary: Oracle WebLogic Server Get JDBC driver parameters
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      responses:
        '200':
          description: JDBC driver parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JDBCDriverParams'
    post:
      operationId: updateJDBCDriverParams
      summary: Oracle WebLogic Server Update JDBC driver parameters
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JDBCDriverParams'
      responses:
        '200':
          description: JDBC driver parameters updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JDBCSystemResources/{resourceName}/JDBCResource/JDBCDriverParams/properties/properties:
    get:
      operationId: listJDBCProperties
      summary: Oracle WebLogic Server List JDBC driver properties
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      responses:
        '200':
          description: Collection of JDBC driver properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
    post:
      operationId: createJDBCProperty
      summary: Oracle WebLogic Server Add a JDBC driver property
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Property'
      responses:
        '201':
          description: Property created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /dataSources:
    get:
      operationId: getDataSources
      summary: Oracle WebLogic Server APIs List all data source metrics
      description: Returns monitoring metrics for all JDBC data sources across all servers in the domain.
      tags:
      - Data Sources
      responses:
        '200':
          description: List of data source metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSourceMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /dataSources/{dataSourceName}:
    get:
      operationId: getDataSource
      summary: Oracle WebLogic Server APIs Get data source metrics
      description: Returns detailed metrics for a specific JDBC data source.
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/dataSourceName'
      responses:
        '200':
          description: Data source metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /dataSources/{dataSourceName}/test:
    post:
      operationId: testDataSource
      summary: Oracle WebLogic Server APIs Test a data source connection
      description: Tests the connection pool for the specified data source by reserving and releasing a connection.
      tags:
      - Data Sources
      parameters:
      - $ref: '#/components/parameters/dataSourceName'
      responses:
        '200':
          description: Data source test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Test result status
                  message:
                    type: string
                    description: Test result message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
components:
  schemas:
    JDBCDriverParams:
      type: object
      properties:
        driverName:
          type: string
          description: Fully qualified JDBC driver class name
        url:
          type: string
          description: JDBC connection URL
        password:
          type: string
          format: password
          description: Database password (encrypted)
    Property:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Property name
        value:
          type: string
          description: Property value
    JDBCDataSourceParams:
      type: object
      properties:
        JNDINames:
          type: array
          items:
            type: string
          description: JNDI names for the data source
        globalTransactionsProtocol:
          type: string
          description: Global transaction protocol
          enum:
          - TwoPhaseCommit
          - LoggingLastResource
          - EmulateTwoPhaseCommit
          - OnePhaseCommit
          - None
    JDBCSystemResource:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
          description: JDBC system resource name
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
          description: Deployment targets
        descriptorFileName:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    JDBCResource:
      type: object
      properties:
        name:
          type: string
          description: JDBC resource name
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title for the link
    Identity:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
          description: Bean identity path as an array of path segments
    JDBCSystemResourceCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: JDBC data source name
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
          description: Deployment targets (servers or clusters)
    DataSourceMetrics:
      type: object
      properties:
        name:
          type: string
          description: Data source name
        state:
          type: string
          description: Data source state
          enum:
          - Running
          - Suspended
          - Shutdown
          - Overloaded
          - Unknown
        enabled:
          type: boolean
          description: Whether the data source is enabled
        activeConnectionsCurrentCount:
          type: integer
          description: Current active connections
        activeConnectionsHighCount:
          type: integer
          description: High watermark of active connections
        connectionsTotalCount:
          type: integer
          description: Total connections created
        currCapacity:
          type: integer
          description: Current capacity
        numAvailable:
          type: integer
          description: Available connections
        numUnavailable:
          type: integer
          description: Unavailable connections
        waitingForConnectionCurrentCount:
          type: integer
          description: Threads waiting for a connection
        waitSecondsHighCount:
          type: integer
          description: Highest wait time in seconds
        connectionDelayTime:
          type: integer
          description: Average connection creation time in ms
        failuresToReconnectCount:
          type: integer
          description: Failed reconnection attempts
        leakedConnectionCount:
          type: integer
          description: Leaked connections
        prepStmtCacheCurrentSize:
          type: integer
          description: Prepared statement cache size
        serverName:
          type: string
          description: Server hosting this data source instance
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  parameters:
    SaveChanges:
      name: saveChanges
      in: query
      description: When false, changes are saved to the edit session but not validated until explicitly saved or activated.
      schema:
        type: boolean
        default: true
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
    Links:
      name: links
      in: query
      description: Comma-separated list of link relations to include (e.g., self, parent, canonical). Use 'none' to exclude all links.
      schema:
        type: string
      example: none
    ResourceName:
      name: resourceName
      in: path
      required: true
      description: Name of the resource
      schema:
        type: string
    Fields:
      name: fields
      in: query
      description: Comma-separated list of property names to include in the response
      schema:
        type: string
      example: name,listenPort
    dataSourceName:
      name: dataSourceName
      in: path
      required: true
      description: The name of the JDBC data source
      schema:
        type: string
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using WebLogic Server credentials. Users must have appropriate roles (Admin, Operator, Deployer, or Monitor).
x-refined-from:
- oracle-weblogic-management-openapi.yml
- weblogic-data-sources-api-openapi.yml
