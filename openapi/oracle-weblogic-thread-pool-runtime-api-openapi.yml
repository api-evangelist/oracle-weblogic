openapi: 3.2.0
info:
  title: Oracle WebLogic Server Oracle WebLogic Monitoring and…
  description: RESTful API for accessing runtime monitoring data, diagnostics information, and performance metrics for Oracle WebLogic Server domains. Provides read-only access to the domainRuntime and serverRuntime bean trees for monitoring server states, application runtimes, JDBC data source health, JMS statistics, thread pool utilization, and server lifecycle management operations.
  version: 12.2.1.3.0
  contact:
    name: Oracle Support
    url: https://support.oracle.com/
  license:
    name: Oracle Standard License
    url: https://www.oracle.com/downloads/licenses/standard-license.html
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Server (configurable)
  variables:
    host:
      default: localhost
    port:
      default: '7001'
    version:
      default: latest
security:
- basicAuth: []
tags:
- name: Thread Pool Runtime
  description: Monitor thread pool utilization
paths:
  /domainRuntime/serverRuntimes/{serverName}/threadPoolRuntime:
    get:
      operationId: getThreadPoolRuntime
      summary: Oracle WebLogic Server Get thread pool runtime for a server
      description: Returns thread pool statistics for the specified server.
      tags:
      - Thread Pool Runtime
      parameters:
      - $ref: '#/components/parameters/ServerName'
      responses:
        '200':
          description: Thread pool runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPoolRuntime'
components:
  schemas:
    ThreadPoolRuntime:
      type: object
      properties:
        name:
          type: string
        executeThreadTotalCount:
          type: integer
          description: Total number of execute threads
        executeThreadIdleCount:
          type: integer
          description: Number of idle execute threads
        hoggingThreadCount:
          type: integer
          description: Number of threads that are hogging resources
        standbyThreadCount:
          type: integer
          description: Number of standby threads
        pendingUserRequestCount:
          type: integer
          description: Number of pending user requests
        queueLength:
          type: integer
          description: Work manager queue length
        completedRequestCount:
          type: integer
          description: Total completed requests
        throughput:
          type: number
          description: Request throughput
        healthState:
          $ref: '#/components/schemas/HealthState'
    HealthState:
      type: object
      properties:
        state:
          type: string
          enum:
          - HEALTH_OK
          - HEALTH_WARN
          - HEALTH_CRITICAL
          - HEALTH_FAILED
          - HEALTH_OVERLOADED
        subsystemName:
          type: string
        partitionName:
          type: string
        symptoms:
          type: array
          items:
            type: object
  parameters:
    ServerName:
      name: serverName
      in: path
      required: true
      description: Name of the WebLogic Server instance
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with WebLogic Server credentials
externalDocs:
  description: WebLogic Server Monitoring Documentation
  url: https://docs.oracle.com/middleware/12213/wls/WLRUR/overview.htm
