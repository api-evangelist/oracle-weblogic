openapi: 3.2.0
info:
  title: Oracle Weblogic Clusters API
  version: '1.0'
  description: 'Operations tagged Clusters across 2 of this provider''s published API definitions: oracle-weblogic-management-openapi.yml, weblogic-clusters-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
      description: WebLogic admin server hostname
    port:
      default: '7001'
      description: WebLogic admin server listen port
    version:
      default: latest
      description: REST API version (e.g., latest, 12.2.1.3.0)
- url: https://{host}:{port}/management/weblogic/latest
  description: WebLogic Server Administration Server
  variables:
    host:
      default: localhost
      description: Hostname of the WebLogic Administration Server
    port:
      default: '7001'
      description: Port of the WebLogic Administration Server
security:
- basicAuth: []
tags:
- name: Clusters
  description: Manage WebLogic Server clusters and dynamic servers
paths:
  /edit/clusters:
    get:
      operationId: listClusters
      summary: Oracle WebLogic Server List all clusters
      description: Returns a collection of all cluster configurations in the domain.
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Collection of clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
    post:
      operationId: createCluster
      summary: Oracle WebLogic Server Create a new cluster
      description: Creates a new cluster configuration. Requires an active edit session.
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '201':
          description: Cluster created successfully
          headers:
            Location:
              schema:
                type: string
                format: uri
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/clusterCreateForm:
    get:
      operationId: getClusterCreateForm
      summary: Oracle WebLogic Server Get cluster creation form with defaults
      tags:
      - Clusters
      responses:
        '200':
          description: Cluster create form with default values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCreateRequest'
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/clusters/{clusterName}:
    get:
      operationId: getCluster
      summary: Oracle WebLogic Server Get a specific cluster configuration
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/ClusterName'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Links'
      responses:
        '200':
          description: Cluster configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateCluster
      summary: Oracle WebLogic Server Update a cluster configuration
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/ClusterName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateRequest'
      responses:
        '200':
          description: Cluster updated
    delete:
      operationId: deleteCluster
      summary: Oracle WebLogic Server Delete a cluster
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/ClusterName'
      - $ref: '#/components/parameters/XRequestedBy'
      responses:
        '204':
          description: Cluster deleted
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/clusters/{clusterName}/dynamicServers:
    get:
      operationId: getDynamicServers
      summary: Oracle WebLogic Server Get dynamic server configuration for a cluster
      description: Returns the dynamic server configuration for the specified cluster.
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/ClusterName'
      responses:
        '200':
          description: Dynamic servers configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicServers'
    post:
      operationId: updateDynamicServers
      summary: Oracle WebLogic Server Configure dynamic servers for a cluster
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/ClusterName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicServers'
      responses:
        '200':
          description: Dynamic servers configuration updated
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /clusters:
    get:
      operationId: getClusters
      summary: Oracle WebLogic Server APIs List all monitored clusters
      description: Returns monitoring information for all clusters in the domain including member servers and cluster health.
      tags:
      - Clusters
      responses:
        '200':
          description: List of monitored clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClusterMonitoring'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /clusters/{clusterName}:
    get:
      operationId: getCluster
      summary: Oracle WebLogic Server APIs Get cluster monitoring information
      description: Returns detailed monitoring information for a specific cluster including member server states and cluster health.
      tags:
      - Clusters
      parameters:
      - $ref: '#/components/parameters/clusterName'
      responses:
        '200':
          description: Cluster monitoring information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterMonitoring'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound_2'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
components:
  parameters:
    ClusterName:
      name: clusterName
      in: path
      required: true
      description: Name of the cluster
      schema:
        type: string
    Fields:
      name: fields
      in: query
      description: Comma-separated list of property names to include in the response
      schema:
        type: string
      example: name,listenPort
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
    Links:
      name: links
      in: query
      description: Comma-separated list of link relations to include (e.g., self, parent, canonical). Use 'none' to exclude all links.
      schema:
        type: string
      example: none
    clusterName:
      name: clusterName
      in: path
      required: true
      description: The name of the WebLogic cluster
      schema:
        type: string
  schemas:
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title for the link
    DynamicServers:
      type: object
      properties:
        serverTemplate:
          type: array
          items:
            type: string
          description: Server template reference as identity path
        dynamicClusterSize:
          type: integer
          description: Number of dynamic server instances
        maxDynamicClusterSize:
          type: integer
          description: Maximum number of dynamic server instances
        serverNamePrefix:
          type: string
          description: Prefix for dynamically created server names
        calculateListenPorts:
          type: boolean
          description: Whether to auto-calculate listen ports
    ClusterCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Cluster name
        clusterMessagingMode:
          type: string
          enum:
          - unicast
          - multicast
    Cluster:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
          description: Cluster name
        clusterMessagingMode:
          type: string
          description: Messaging mode for the cluster
          enum:
          - unicast
          - multicast
        clusterBroadcastChannel:
          type: string
        defaultLoadAlgorithm:
          type: string
          enum:
          - round-robin
          - weight-based
          - random
          - round-robin-affinity
          - weight-based-affinity
        weblogicPluginEnabled:
          type: boolean
        frontendHost:
          type: string
        frontendHTTPPort:
          type: integer
        frontendHTTPSPort:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ClusterUpdateRequest:
      type: object
      properties:
        clusterMessagingMode:
          type: string
          enum:
          - unicast
          - multicast
        defaultLoadAlgorithm:
          type: string
          enum:
          - round-robin
          - weight-based
          - random
        weblogicPluginEnabled:
          type: boolean
    ClusterMonitoring:
      type: object
      properties:
        name:
          type: string
          description: Cluster name
        servers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              state:
                type: string
              health:
                type: string
          description: Cluster member servers and their states
        aliveServerCount:
          type: integer
          description: Number of alive servers in the cluster
        resendRequestsCount:
          type: integer
          format: int64
          description: Number of resent requests
        fragmentsReceivedCount:
          type: integer
          format: int64
          description: Number of fragments received
        fragmentsSentCount:
          type: integer
          format: int64
          description: Number of fragments sent
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    NotFound:
      description: Requested resource does not exist
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound_2:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using WebLogic Server credentials. Users must have appropriate roles (Admin, Operator, Deployer, or Monitor).
x-refined-from:
- oracle-weblogic-management-openapi.yml
- weblogic-clusters-api-openapi.yml
