openapi: 3.2.0
info:
  title: Oracle WebLogic Server Oracle WebLogic Monitoring and…
  description: RESTful API for accessing runtime monitoring data, diagnostics information, and performance metrics for Oracle WebLogic Server domains. Provides read-only access to the domainRuntime and serverRuntime bean trees for monitoring server states, application runtimes, JDBC data source health, JMS statistics, thread pool utilization, and server lifecycle management operations.
  version: 12.2.1.3.0
  contact:
    name: Oracle Support
    url: https://support.oracle.com/
  license:
    name: Oracle Standard License
    url: https://www.oracle.com/downloads/licenses/standard-license.html
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Server (configurable)
  variables:
    host:
      default: localhost
    port:
      default: '7001'
    version:
      default: latest
security:
- basicAuth: []
tags:
- name: JMS Runtime
  description: Monitor JMS server and destination runtime statistics
paths:
  /domainRuntime/serverRuntimes/{serverName}/JMSRuntime:
    get:
      operationId: getJMSRuntime
      summary: Oracle WebLogic Server Get JMS runtime for a server
      description: Returns the JMS runtime for the specified server.
      tags:
      - JMS Runtime
      parameters:
      - $ref: '#/components/parameters/ServerName'
      responses:
        '200':
          description: JMS runtime information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JMSRuntime'
  /domainRuntime/serverRuntimes/{serverName}/JMSRuntime/JMSServersRuntime:
    get:
      operationId: listJMSServerRuntimes
      summary: Oracle WebLogic Server List JMS server runtimes
      tags:
      - JMS Runtime
      parameters:
      - $ref: '#/components/parameters/ServerName'
      responses:
        '200':
          description: Collection of JMS server runtimes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSServerRuntime'
components:
  schemas:
    JMSRuntime:
      type: object
      properties:
        name:
          type: string
        connectionsCurrentCount:
          type: integer
          description: Current JMS connections
        connectionsHighCount:
          type: integer
        connectionsTotalCount:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
        title:
          type: string
    JMSServerRuntime:
      type: object
      properties:
        name:
          type: string
          description: JMS server name
        messagesCurrentCount:
          type: integer
          description: Current messages in the JMS server
        messagesHighCount:
          type: integer
        messagesPendingCount:
          type: integer
        messagesReceivedCount:
          type: integer
        bytesCurrentCount:
          type: integer
        bytesHighCount:
          type: integer
        bytesPendingCount:
          type: integer
        bytesReceivedCount:
          type: integer
        destinationsCurrentCount:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
  parameters:
    ServerName:
      name: serverName
      in: path
      required: true
      description: Name of the WebLogic Server instance
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with WebLogic Server credentials
externalDocs:
  description: WebLogic Server Monitoring Documentation
  url: https://docs.oracle.com/middleware/12213/wls/WLRUR/overview.htm
