openapi: 3.2.0
info:
  title: Oracle Weblogic JMS API
  version: '1.0'
  description: 'Operations tagged JMS across 2 of this provider''s published API definitions: oracle-weblogic-management-openapi.yml, weblogic-jms-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:7001/management/weblogic/latest
  description: WebLogic Administration Server (default)
- url: http://{host}:{port}/management/weblogic/{version}
  description: WebLogic Administration Server (configurable)
  variables:
    host:
      default: localhost
      description: WebLogic admin server hostname
    port:
      default: '7001'
      description: WebLogic admin server listen port
    version:
      default: latest
      description: REST API version (e.g., latest, 12.2.1.3.0)
- url: https://{host}:{port}/management/weblogic/latest
  description: WebLogic Server Administration Server
  variables:
    host:
      default: localhost
      description: Hostname of the WebLogic Administration Server
    port:
      default: '7001'
      description: Port of the WebLogic Administration Server
security:
- basicAuth: []
tags:
- name: JMS
  description: Manage JMS servers, system resources, queues, and connection factories
paths:
  /edit/JMSServers:
    get:
      operationId: listJMSServers
      summary: Oracle WebLogic Server List all JMS servers
      tags:
      - JMS
      responses:
        '200':
          description: Collection of JMS servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSServer'
    post:
      operationId: createJMSServer
      summary: Oracle WebLogic Server Create a JMS server
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JMSServerCreateRequest'
      responses:
        '201':
          description: JMS server created
          headers:
            Location:
              schema:
                type: string
                format: uri
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JMSServers/{jmsServerName}:
    get:
      operationId: getJMSServer
      summary: Oracle WebLogic Server Get a JMS server configuration
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSServerName'
      responses:
        '200':
          description: JMS server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JMSServer'
    delete:
      operationId: deleteJMSServer
      summary: Oracle WebLogic Server Delete a JMS server
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSServerName'
      - $ref: '#/components/parameters/XRequestedBy'
      responses:
        '204':
          description: JMS server deleted
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JMSSystemResources:
    get:
      operationId: listJMSSystemResources
      summary: Oracle WebLogic Server List all JMS system resources
      tags:
      - JMS
      responses:
        '200':
          description: Collection of JMS system resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSSystemResource'
    post:
      operationId: createJMSSystemResource
      summary: Oracle WebLogic Server Create a JMS system resource
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JMSSystemResourceCreateRequest'
      responses:
        '201':
          description: JMS system resource created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JMSSystemResources/{jmsResourceName}/JMSResource/connectionFactories:
    get:
      operationId: listJMSConnectionFactories
      summary: Oracle WebLogic Server List JMS connection factories
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      responses:
        '200':
          description: Collection of connection factories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSConnectionFactory'
    post:
      operationId: createJMSConnectionFactory
      summary: Oracle WebLogic Server Create a JMS connection factory
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JMSConnectionFactoryCreateRequest'
      responses:
        '201':
          description: Connection factory created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JMSSystemResources/{jmsResourceName}/JMSResource/uniformDistributedQueues:
    get:
      operationId: listJMSDistributedQueues
      summary: Oracle WebLogic Server List JMS uniform distributed queues
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      responses:
        '200':
          description: Collection of distributed queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSDistributedQueue'
    post:
      operationId: createJMSDistributedQueue
      summary: Oracle WebLogic Server Create a JMS uniform distributed queue
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JMSDistributedQueueCreateRequest'
      responses:
        '201':
          description: Distributed queue created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/JMSSystemResources/{jmsResourceName}/subDeployments:
    get:
      operationId: listJMSSubDeployments
      summary: Oracle WebLogic Server List JMS sub-deployments
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      responses:
        '200':
          description: Collection of sub-deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSSubDeployment'
    post:
      operationId: createJMSSubDeployment
      summary: Oracle WebLogic Server Create a JMS sub-deployment
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/JMSResourceName'
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JMSSubDeploymentCreateRequest'
      responses:
        '201':
          description: Sub-deployment created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /edit/fileStores:
    get:
      operationId: listFileStores
      summary: Oracle WebLogic Server List all file stores
      tags:
      - JMS
      responses:
        '200':
          description: Collection of file stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileStore'
    post:
      operationId: createFileStore
      summary: Oracle WebLogic Server Create a file store
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/XRequestedBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileStoreCreateRequest'
      responses:
        '201':
          description: File store created
    servers:
    - url: http://localhost:7001/management/weblogic/latest
      description: WebLogic Administration Server (default)
    - url: http://{host}:{port}/management/weblogic/{version}
      description: WebLogic Administration Server (configurable)
      variables:
        host:
          default: localhost
          description: WebLogic admin server hostname
        port:
          default: '7001'
          description: WebLogic admin server listen port
        version:
          default: latest
          description: REST API version (e.g., latest, 12.2.1.3.0)
  /JMSServers:
    get:
      operationId: getJMSServers
      summary: Oracle WebLogic Server APIs List all JMS server metrics
      description: Returns monitoring metrics for all JMS servers in the domain.
      tags:
      - JMS
      responses:
        '200':
          description: List of JMS server metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSServerMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /JMSServers/{jmsServerName}:
    get:
      operationId: getJMSServersByJmsServerName
      summary: Oracle WebLogic Server APIs Get JMS server metrics
      description: Returns detailed metrics for a specific JMS server.
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/jmsServerName'
      responses:
        '200':
          description: JMS server metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JMSServerMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-operation-id-source: normalized
      x-operation-id-original: getJMSServer
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
  /JMSServers/{jmsServerName}/destinations:
    get:
      operationId: getJMSDestinations
      summary: Oracle WebLogic Server APIs List JMS destinations
      description: Returns monitoring metrics for all destinations on a JMS server.
      tags:
      - JMS
      parameters:
      - $ref: '#/components/parameters/jmsServerName'
      responses:
        '200':
          description: List of JMS destination metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JMSDestinationMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://{host}:{port}/management/weblogic/latest
      description: WebLogic Server Administration Server
      variables:
        host:
          default: localhost
          description: Hostname of the WebLogic Administration Server
        port:
          default: '7001'
          description: Port of the WebLogic Administration Server
components:
  schemas:
    FileStoreCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        directory:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    JMSSystemResourceCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    JMSSystemResource:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    JMSSubDeploymentCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    FileStore:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
        directory:
          type: string
          description: Directory for the file store
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    JMSDistributedQueueCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        subDeploymentName:
          type: string
    JMSConnectionFactory:
      type: object
      properties:
        name:
          type: string
          description: Connection factory name
        JNDIName:
          type: string
          description: JNDI name
        subDeploymentName:
          type: string
          description: Sub-deployment name for targeting
    JMSServer:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
        name:
          type: string
          description: JMS server name
        messagesMaximum:
          type: integer
          description: Maximum number of messages
        bytesMaximum:
          type: integer
          description: Maximum bytes
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        persistentStore:
          type: array
          items:
            type: string
          description: Persistent store reference as identity path
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    JMSConnectionFactoryCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        subDeploymentName:
          type: string
    Link:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
        href:
          type: string
          format: uri
          description: URL of the linked resource
        title:
          type: string
          description: Human-readable title for the link
    JMSDistributedQueue:
      type: object
      properties:
        name:
          type: string
          description: Distributed queue name
        JNDIName:
          type: string
          description: JNDI name
        subDeploymentName:
          type: string
    Identity:
      type: object
      properties:
        identity:
          type: array
          items:
            type: string
          description: Bean identity path as an array of path segments
    JMSServerCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: JMS server name
        messagesMaximum:
          type: integer
        bytesMaximum:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        persistentStore:
          type: array
          items:
            type: string
    JMSSubDeployment:
      type: object
      properties:
        name:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    JMSServerMetrics:
      type: object
      properties:
        name:
          type: string
          description: JMS server name
        messagesCurrentCount:
          type: integer
          format: int64
          description: Current messages
        messagesPendingCount:
          type: integer
          format: int64
          description: Pending messages
        messagesHighCount:
          type: integer
          format: int64
          description: High watermark of messages
        messagesReceivedCount:
          type: integer
          format: int64
          description: Total messages received
        bytesCurrentCount:
          type: integer
          format: int64
          description: Current bytes
        bytesPendingCount:
          type: integer
          format: int64
          description: Pending bytes
        consumersCurrentCount:
          type: integer
          format: int64
          description: Current consumers
        consumersHighCount:
          type: integer
          format: int64
          description: High watermark of consumers
        destinationsCurrentCount:
          type: integer
          format: int64
          description: Current destinations
        healthState:
          type: object
          properties:
            state:
              type: string
            subsystemName:
              type: string
    JMSDestinationMetrics:
      type: object
      properties:
        name:
          type: string
          description: Destination name
        type:
          type: string
          description: Destination type
          enum:
          - Queue
          - Topic
        messagesCurrentCount:
          type: integer
          format: int64
          description: Current messages in the destination
        messagesPendingCount:
          type: integer
          format: int64
          description: Pending messages
        messagesHighCount:
          type: integer
          format: int64
          description: High watermark of messages
        messagesReceivedCount:
          type: integer
          format: int64
          description: Total received messages
        consumersCurrentCount:
          type: integer
          format: int64
          description: Current consumers
        consumersHighCount:
          type: integer
          format: int64
          description: High watermark of consumers
        consumersTotal:
          type: integer
          format: int64
          description: Total consumers created
        bytesCurrentCount:
          type: integer
          format: int64
          description: Current total bytes
        bytesPendingCount:
          type: integer
          format: int64
          description: Pending bytes
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  parameters:
    JMSResourceName:
      name: jmsResourceName
      in: path
      required: true
      description: Name of the JMS system resource
      schema:
        type: string
    JMSServerName:
      name: jmsServerName
      in: path
      required: true
      description: Name of the JMS server
      schema:
        type: string
    XRequestedBy:
      name: X-Requested-By
      in: header
      required: true
      description: CSRF protection header required for POST and DELETE requests
      schema:
        type: string
        example: MyClient
    jmsServerName:
      name: jmsServerName
      in: path
      required: true
      description: The name of the JMS server
      schema:
        type: string
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using WebLogic Server credentials. Users must have appropriate roles (Admin, Operator, Deployer, or Monitor).
x-refined-from:
- oracle-weblogic-management-openapi.yml
- weblogic-jms-api-openapi.yml
